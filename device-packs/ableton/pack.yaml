description: |
  Ableton control surfaces. The Push profile covers the Ableton Push
  Mk1 / Mk2 — 8x8 RGB pad grid + 8 endless encoders + transport +
  modifier keys + clip launcher + step sequencer.

  Push uses User-Mode MIDI (note-on per pad, CC for encoders +
  buttons) on channel 1. RGB LED feedback via Note-on velocity in
  Live mode; SysEx for color palette + brightness in User mode.
