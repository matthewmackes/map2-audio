schema_version: 1
identity:
  manufacturer: Mackie
  model: mcu-pro-daw
  alsa_client_pattern: 'Mackie Control'
  hardware_id: alsa-seq:Mackie Control:0

# T2503 Set 6 — DAW-mode overlay for Mackie MCU Pro.
#
# This profile is the MCU equivalent for the MAP2 DAW service. Same hardware
# surface as mcu-pro.midi.yaml, but every binding emits ``daw.*`` engine_command
# verbs instead of ``audio.chain.*`` (live-mode targets).
#
# The controller-host loads the profile that matches the active MAP2 mode:
#   live mode  → mcu-pro.midi.yaml      (existing)
#   DAW mode   → mcu-pro-daw.midi.yaml  (this file)
# Mode switch flushes pending bindings; controller-host's mode-aware loader is
# the seam.
#
# Bidirectional MCU surface continues to use scripts/mcu_daw.js. Scribble-strip
# text reflects DAW state (track names, transport state, time-code) instead of
# chain names.

scripts:
  - scripts/mcu_daw.js

controls:
  # ---------- Faders (pitch-bend per channel; 14-bit) ----------
  # Each MCU fader maps to a DAW track gain. Track ordering follows the active
  # project's tracks[] list; bank navigation slides the visible 8.
  - { status: 0xE0, channel: 1, action: set, target: daw.track.gain, script: MCU_DAW.fader, description: 'Fader 1 → track[bank+0] gain.' }
  - { status: 0xE1, channel: 2, action: set, target: daw.track.gain, script: MCU_DAW.fader, description: 'Fader 2 → track[bank+1] gain.' }
  - { status: 0xE2, channel: 3, action: set, target: daw.track.gain, script: MCU_DAW.fader, description: 'Fader 3 → track[bank+2] gain.' }
  - { status: 0xE3, channel: 4, action: set, target: daw.track.gain, script: MCU_DAW.fader, description: 'Fader 4 → track[bank+3] gain.' }
  - { status: 0xE4, channel: 5, action: set, target: daw.track.gain, script: MCU_DAW.fader, description: 'Fader 5 → track[bank+4] gain.' }
  - { status: 0xE5, channel: 6, action: set, target: daw.track.gain, script: MCU_DAW.fader, description: 'Fader 6 → track[bank+5] gain.' }
  - { status: 0xE6, channel: 7, action: set, target: daw.track.gain, script: MCU_DAW.fader, description: 'Fader 7 → track[bank+6] gain.' }
  - { status: 0xE7, channel: 8, action: set, target: daw.track.gain, script: MCU_DAW.fader, description: 'Fader 8 → track[bank+7] gain.' }

  # ---------- V-Pot encoders (relative CC) — plugin param scrubbing ----------
  # In DAW mode, V-Pots scrub the currently-selected plugin param on each
  # banked track. mcu_daw.js holds the (track_id, slot, param_id) tuple and
  # synthesizes daw.plugin.set_param frames from the encoder deltas.
  - { status: 0xB0, midino: 0x10, channel: 1, action: increment, script: MCU_DAW.vpot_param, description: 'V-Pot 1 → selected plugin param on track[bank+0].' }
  - { status: 0xB0, midino: 0x11, channel: 1, action: increment, script: MCU_DAW.vpot_param, description: 'V-Pot 2 → selected plugin param on track[bank+1].' }
  - { status: 0xB0, midino: 0x12, channel: 1, action: increment, script: MCU_DAW.vpot_param, description: 'V-Pot 3 → selected plugin param on track[bank+2].' }
  - { status: 0xB0, midino: 0x13, channel: 1, action: increment, script: MCU_DAW.vpot_param, description: 'V-Pot 4 → selected plugin param on track[bank+3].' }
  - { status: 0xB0, midino: 0x14, channel: 1, action: increment, script: MCU_DAW.vpot_param, description: 'V-Pot 5 → selected plugin param on track[bank+4].' }
  - { status: 0xB0, midino: 0x15, channel: 1, action: increment, script: MCU_DAW.vpot_param, description: 'V-Pot 6 → selected plugin param on track[bank+5].' }
  - { status: 0xB0, midino: 0x16, channel: 1, action: increment, script: MCU_DAW.vpot_param, description: 'V-Pot 7 → selected plugin param on track[bank+6].' }
  - { status: 0xB0, midino: 0x17, channel: 1, action: increment, script: MCU_DAW.vpot_param, description: 'V-Pot 8 → selected plugin param on track[bank+7].' }

  # ---------- Rec-arm per channel (Notes 0x00..0x07) ----------
  - { status: 0x90, midino: 0x00, channel: 1, action: set, script: MCU_DAW.rec_arm, description: 'REC-ARM 1 → daw.track.set_arm[bank+0].' }
  - { status: 0x90, midino: 0x01, channel: 1, action: set, script: MCU_DAW.rec_arm, description: 'REC-ARM 2 → daw.track.set_arm[bank+1].' }
  - { status: 0x90, midino: 0x02, channel: 1, action: set, script: MCU_DAW.rec_arm, description: 'REC-ARM 3 → daw.track.set_arm[bank+2].' }
  - { status: 0x90, midino: 0x03, channel: 1, action: set, script: MCU_DAW.rec_arm, description: 'REC-ARM 4 → daw.track.set_arm[bank+3].' }
  - { status: 0x90, midino: 0x04, channel: 1, action: set, script: MCU_DAW.rec_arm, description: 'REC-ARM 5 → daw.track.set_arm[bank+4].' }
  - { status: 0x90, midino: 0x05, channel: 1, action: set, script: MCU_DAW.rec_arm, description: 'REC-ARM 6 → daw.track.set_arm[bank+5].' }
  - { status: 0x90, midino: 0x06, channel: 1, action: set, script: MCU_DAW.rec_arm, description: 'REC-ARM 7 → daw.track.set_arm[bank+6].' }
  - { status: 0x90, midino: 0x07, channel: 1, action: set, script: MCU_DAW.rec_arm, description: 'REC-ARM 8 → daw.track.set_arm[bank+7].' }

  # ---------- Transport (Notes 0x5B..0x5F) ----------
  - { status: 0x90, midino: 0x5B, channel: 1, action: set, target: daw.transport.set_position, script: MCU_DAW.rewind,    description: 'REWIND → daw.transport.set_position(0).' }
  - { status: 0x90, midino: 0x5C, channel: 1, action: set, script: MCU_DAW.fast_forward,                               description: 'FFWD → daw.transport.set_position(end).' }
  - { status: 0x90, midino: 0x5D, channel: 1, action: set, target: daw.transport.stop,    description: 'STOP → daw.transport.stop.' }
  - { status: 0x90, midino: 0x5E, channel: 1, action: set, target: daw.transport.play,    description: 'PLAY → daw.transport.play.' }
  - { status: 0x90, midino: 0x5F, channel: 1, action: set, target: daw.transport.record,  description: 'RECORD → daw.transport.record(arm=true).' }

  # ---------- Bank navigation (Notes 0x2E..0x2F = bank L/R) ----------
  - { status: 0x90, midino: 0x2E, channel: 1, action: set, script: MCU_DAW.bank_left,  description: 'BANK ◀ → shift visible 8 tracks left.' }
  - { status: 0x90, midino: 0x2F, channel: 1, action: set, script: MCU_DAW.bank_right, description: 'BANK ▶ → shift visible 8 tracks right.' }
