schema_version: 1
identity:
  manufacturer: Native Instruments
  model: maschine-mk1
  alsa_client_pattern: 'MAP2:Maschine-MK1'
  hardware_id: usb:17cc:0808

scripts:
  - scripts/maschine-mk1.js

# Maschine MK1 MIDI-mode mapping. The HID/USB control surface (LEDs, dual
# displays, 12-bit pad pressure stream) is owned by the Python daemon at
# app/services/maschine/maschine_mk1_daemon.py and publishes a virtual
# ALSA-seq port named "MAP2:Maschine-MK1" — this profile binds against
# that virtual port, not the raw 17cc:0808 USB endpoints.
controls:
  # 16 pressure pads (notes 36..51 -> Pad 1..16).
  - status: 0x90
    midino: 36
    script: MaschineMK1.pad_1
    description: 'Pad 1.'
  - status: 0x90
    midino: 37
    script: MaschineMK1.pad_2
    description: 'Pad 2.'
  - status: 0x90
    midino: 38
    script: MaschineMK1.pad_3
    description: 'Pad 3.'
  - status: 0x90
    midino: 39
    script: MaschineMK1.pad_4
    description: 'Pad 4.'
  - status: 0x90
    midino: 40
    script: MaschineMK1.pad_5
    description: 'Pad 5.'
  - status: 0x90
    midino: 41
    script: MaschineMK1.pad_6
    description: 'Pad 6.'
  - status: 0x90
    midino: 42
    script: MaschineMK1.pad_7
    description: 'Pad 7.'
  - status: 0x90
    midino: 43
    script: MaschineMK1.pad_8
    description: 'Pad 8.'
  - status: 0x90
    midino: 44
    script: MaschineMK1.pad_9
    description: 'Pad 9.'
  - status: 0x90
    midino: 45
    script: MaschineMK1.pad_10
