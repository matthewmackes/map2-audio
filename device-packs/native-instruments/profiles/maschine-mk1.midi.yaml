    script: MaschineMK1.pad_12
    description: 'Pad 12.'
  - status: 0x90
    midino: 48
    script: MaschineMK1.pad_13
    description: 'Pad 13.'
  - status: 0x90
    midino: 49
    script: MaschineMK1.pad_14
    description: 'Pad 14.'
  - status: 0x90
    midino: 50
    script: MaschineMK1.pad_15
    description: 'Pad 15.'
  - status: 0x90
    midino: 51
    script: MaschineMK1.pad_16
    description: 'Pad 16.'

  # 11 rotary encoders (relative). NAVIGATE is the push-push center
  # encoder; ENCODER 1..7 are the row above the displays; VOLUME / TEMPO
  # / SWING are the dedicated knobs.
  - status: 0xB0
    midino: 0
    action: set
    script: MaschineMK1.navigate_encoder
    description: 'NAVIGATE encoder (CC 0).'
  - status: 0xB0
    midino: 1
    action: set
    script: MaschineMK1.encoder_1
    description: 'ENCODER 1 (CC 1).'
  - status: 0xB0
    midino: 2
    action: set
    script: MaschineMK1.encoder_2
    description: 'ENCODER 2 (CC 2).'
  - status: 0xB0
    midino: 3
