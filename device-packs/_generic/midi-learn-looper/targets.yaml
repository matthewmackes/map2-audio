      - verb: audio.looper.0.locked
        label: Track 1 — Write-lock (toggle)
        action_template:
          action: toggle
      - verb: audio.looper.1.locked
        label: Track 2 — Write-lock (toggle)
        action_template:
          action: toggle
      - verb: audio.looper.2.locked
        label: Track 3 — Write-lock (toggle)
