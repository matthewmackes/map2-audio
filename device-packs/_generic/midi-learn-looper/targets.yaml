  - id: master
    label: Master bus
    description: |
      Master-level fader. No per-track index; ride this from an
      expression pedal for a hands-free volume ride across all
      four loop tracks.
    targets:
      - verb: audio.looper.master.level
        label: Master level (dB)
        action_template:
          action: set
        arg_prompts:
          - name: db
            label: Level (dB, clamped -60..+6)
            type: float
            default: 0.0
            min: -60.0
            max: 6.0
