      # T2512-DISPATCH-V2 — stop_mode / sync_mode / quantize_division
      # are indexed-enum setters: value is a zero-based index into the
      # enum's label tuple. fade_ms is a clamped float (0..5000 ms).
      - verb: audio.looper.0.stop_mode
        label: Track 1 — Stop mode (index → hard / fade)
        action_template:
          action: set
        arg_prompts:
          - name: index
            label: Stop-mode index (0=hard, 1=fade)
            type: int
            default: 0
            min: 0
            max: 1
