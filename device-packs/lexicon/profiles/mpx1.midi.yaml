schema_version: 1
identity:
  manufacturer: Lexicon
  model: mpx1
  alsa_client_pattern: 'MPX'
  hardware_id: alsa-seq:MPX:0

scripts:
  - scripts/mpx1.js

# The MPX-1 hardware exposes a small set of CC + Program Change events
# from the front panel; the bulk of operator interaction happens via
# SysEx (Lexicon manufacturer ID 0x06). The control rows below cover
# the front-panel events; SysEx parameter updates flow through the JS
# scripts referenced above (T2459-H4 / T2482-P1.5 cutover surface).
#
# Reference: Lexicon MPX-1 MIDI Implementation Chart (manual app D);
# legacy parser at app/services/mpx1_syx_parser.py.

controls:
  # ---------- Front-panel rotary encoder (Adjust knob) ----------
  - status: 0xB0
    midino: 7
    channel: 1
    action: set
    target: audio.chain.1.macro.adjust
    description: 'Front-panel Adjust knob → macro adjust on chain 1.'

  # ---------- Front-panel transport-style buttons ----------
  - status: 0xB0
    midino: 64
    channel: 1
    action: latch
    target: audio.chain.1.bypass
    script: MPX1.bypass_toggle
    description: 'BYPASS button → toggle chain 1 bypass.'

  - status: 0xB0
    midino: 65
    channel: 1
    action: momentary
    target: audio.chain.1.macro.tap_tempo
    script: MPX1.tap_tempo
    description: 'TAP button → tap-tempo input.'

  # ---------- Program selection ----------
  # MPX-1 ships 200 factory + 50 user programs. Channel 1 PC selects.
  - status: 0xC0
    channel: 1
    action: send_pc
    target: audio.snapshot.recall
    script: MPX1.program_change
    description: 'Program Change (any number) → recall MAP2 snapshot mapped from MPX-1 program slot.'

  # ---------- SysEx preset/parameter dumps ----------
  # The 0xF0 row is a sentinel — the dispatcher routes any inbound
  # SysEx with Lexicon mfr ID 0x06 to MPX1.handle_sysex below.
  # Schema requires status; midino is omitted (sysex carries its own
  # addressing).
  - status: 0xF0
    script: MPX1.handle_sysex
    description: 'Lexicon SysEx (mfr ID 0x06) — preset dumps, parameter writes, and bulk transfers.'

# Outbound LED feedback — MPX-1 mostly drives its own LEDs (the BYPASS
# LED follows the bypass state internally). When MAP2 changes chain 1
# bypass, we echo a CC 64 back so the hardware LED reflects MAP2's
# state (otherwise an external bypass-toggle leaves the panel out of
# sync).
outputs:
  - status: 0xB0
    midino: 64
    channel: 1
    source: audio.chain.1.bypass
    script: MPX1.bypass_feedback
    description: 'Echo bypass state to BYPASS LED (CC 64) so the panel reflects MAP2-side toggles.'

settings:
  - id: mpx1_program_offset
    label: Program slot offset
    type: number
    default: 0
    min: -127
    max: 127
    step: 1
    description: 'Offset added to MPX-1 program-change number when mapping to MAP2 snapshot id.'
  - id: mpx1_sysex_passthrough
    label: SysEx passthrough
    type: boolean
    default: true
    description: 'When true, raw SysEx is passed verbatim to MPX1.handle_sysex; when false, only known parameter writes are dispatched.'
