version: '3.8'

services:
  # MAP2 Audio Node 1 (AUDIO-NODE)
  map2-audio-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: map2-audio-1
    environment:
      MAP2_DEPLOYMENT_MODE: AUDIO-NODE
      MAP2_NODE_ID: AUDIO-NODE-A1B2
      MAP2_API_PORT: 8001
      MAP2_USE_MOCK_LCD: "true"
      MAP2_DATABASE_URL: sqlite+aiosqlite:///data/map2.db
    ports:
      - "8001:8000"
    volumes:
      - ./data/audio-1:/data
      - ./logs/audio-1:/var/log/map2
    networks:
      - map2-cluster
    depends_on:
      - setup
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MAP2 Control Node (CONTROL-NODE)
  map2-control-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: map2-control-1
    environment:
      MAP2_DEPLOYMENT_MODE: CONTROL-NODE
      MAP2_NODE_ID: CONTROL-NODE-C3D4
      MAP2_API_PORT: 8002
      MAP2_USE_MOCK_LCD: "true"
      MAP2_DATABASE_URL: sqlite+aiosqlite:///data/map2.db
    ports:
      - "8002:8000"
    volumes:
      - ./data/control-1:/data
      - ./logs/control-1:/var/log/map2
    networks:
      - map2-cluster
    depends_on:
      - setup
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Setup service (initializes shared resources)
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: map2-setup
    command: /bin/bash -c "python -c 'from app.database import init_async_db; init_async_db()' && echo 'Setup complete'"
    environment:
      MAP2_DATABASE_URL: sqlite+aiosqlite:///data/map2.db
    volumes:
      - ./data:/data
    networks:
      - map2-cluster

networks:
  map2-cluster:
    driver: bridge
    name: map2-cluster

volumes:
  data:
  logs:
