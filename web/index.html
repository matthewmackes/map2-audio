<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/map-brand-mark.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161616" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Mackes Audio Platform — professional audio control and routing workspace" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/css/modGui.css" />
    <style>
        /* Initial paint background: keep #161616 so the first frame
         * before main.tsx + Carbon CSS load doesn't flash white. As
         * soon as the React tree mounts, body gets `background:
         * var(--bg)` from index.css and follows the active theme.
         * The shorthand `background:` without `!important` lets later
         * Carbon-themed rules win without specificity escalation. */
        body {
            background: #161616;
            overscroll-behavior: none;
            margin: 0;
        }
    </style>
    <title>Mackes Audio Platform</title>
</head>

<body>
    <div id="root"></div>
    <noscript>
        <div style="padding:24px;color:#fff;font-family:system-ui,sans-serif">
            Mackes Audio Platform requires JavaScript to run.
        </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
