<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
        }
        .log {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #4CAF50;
            padding-left: 10px;
        }
        .error { border-left-color: #f44336; }
        .success { border-left-color: #4CAF50; }
        .info { border-left-color: #2196F3; }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <p>Testing connection to backend WebSocket...</p>
    <div class="log" id="log"></div>

    <script>
        const log = document.getElementById('log');

        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        addLog('Starting WebSocket connection test...', 'info');
        addLog('Window hostname: ' + window.location.hostname, 'info');

        // Test config.json fetch first
        addLog('Fetching config.json...', 'info');
        fetch('/var/config.json')
            .then(response => response.json())
            .then(data => {
                addLog('Config.json loaded successfully', 'success');
                addLog('Socket server address: ' + data.socket_server_address, 'info');
                addLog('Socket server port: ' + data.socket_server_port, 'info');

                // Determine WebSocket URL
                let wsHost = data.socket_server_address;
                if (!wsHost || wsHost === '*') {
                    wsHost = window.location.hostname;
                }
                const wsPort = data.socket_server_port || 8080;
                const wsUrl = `ws://${wsHost}:${wsPort}/pipedal`;

                addLog('Attempting WebSocket connection to: ' + wsUrl, 'info');

                // Try WebSocket connection
                const ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    addLog('WebSocket connection OPENED successfully!', 'success');
                    addLog('Sending hello message...', 'info');
                    ws.send(JSON.stringify([{message: "hello"}]));
                };

                ws.onmessage = (event) => {
                    addLog('Message received: ' + event.data, 'success');
                };

                ws.onerror = (error) => {
                    addLog('WebSocket ERROR: ' + JSON.stringify(error), 'error');
                };

                ws.onclose = (event) => {
                    addLog(`WebSocket CLOSED. Code: ${event.code}, Reason: ${event.reason}`, 'error');
                };

            })
            .catch(error => {
                addLog('Failed to load config.json: ' + error.message, 'error');
            });

    </script>
</body>
</html>
