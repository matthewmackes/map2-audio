<svg viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Generic PC placeholder -->
  <defs>
    <linearGradient id="metalGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Case body -->
  <rect x="50" y="80" width="200" height="240" rx="8" fill="url(#metalGrad4)" stroke="#6b7280" stroke-width="2"/>
  
  <!-- Front panel -->
  <rect x="60" y="100" width="180" height="200" rx="4" fill="#2d2d2d" stroke="#4b5563" stroke-width="1"/>
  
  <!-- Generic computer icon -->
  <circle cx="150" cy="130" r="15" fill="none" stroke="#666" stroke-width="2"/>
  <rect x="140" y="125" width="20" height="10" fill="none" stroke="#666" stroke-width="1.5"/>
  
  <!-- Drive bays -->
  <rect x="75" y="160" width="150" height="15" rx="2" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <rect x="75" y="185" width="150" height="15" rx="2" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  
  <!-- Power button -->
  <circle cx="85" cy="260" r="8" fill="#666" stroke="#4b5563" stroke-width="1"/>
  
  <!-- Standoff feet -->
  <rect x="65" y="320" width="12" height="6" fill="#6b7280"/>
  <rect x="223" y="320" width="12" height="6" fill="#6b7280"/>
  
  <!-- Label -->
  <text x="150" y="360" font-family="Arial" font-size="12" font-weight="bold" fill="#4b5563" text-anchor="middle">Computer System</text>
</svg>
