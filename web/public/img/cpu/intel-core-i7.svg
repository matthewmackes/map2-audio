<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="intelBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0071C5"/>
      <stop offset="100%" style="stop-color:#004A8F"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect x="2" y="2" width="196" height="96" rx="8" ry="8" fill="url(#intelBlue)"/>
  <!-- Intel arc/swoosh -->
  <path d="M170 15 Q185 25, 180 45 Q175 65, 155 75" stroke="#fff" stroke-width="3" fill="none" opacity="0.3"/>
  <!-- CORE text -->
  <text x="100" y="42" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">CORE</text>
  <!-- i7 text -->
  <text x="100" y="75" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#fff" text-anchor="middle">i7</text>
  <!-- Intel wordmark at bottom -->
  <text x="100" y="92" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle" opacity="0.7">intel</text>
</svg>
