  <text x="1280" y="418" fill="#ffffff" font-family="IBM Plex Sans, Arial, sans-serif" font-size="74" font-weight="700">LEXICON MPX1</text>
  <text x="1280" y="482" fill="#fff1e8" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30">program recall, editing, and rack diagnostics</text>
