  <desc id="desc">Stylized product hero artwork for the HoTone JoGG audio interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#133221" />
