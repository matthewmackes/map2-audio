    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect x="90" y="90" width="1420" height="720" rx="28" fill="#1a1a1a" stroke="#707070" stroke-width="4" />
  <g transform="translate(180 190)">
