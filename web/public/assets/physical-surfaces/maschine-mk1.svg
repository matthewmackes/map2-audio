      <rect x="368" y="216" width="130" height="130" rx="18" />
      <rect x="520" y="216" width="130" height="130" rx="18" />
      <rect x="64" y="368" width="130" height="56" rx="16" />
      <rect x="216" y="368" width="282" height="56" rx="16" />
