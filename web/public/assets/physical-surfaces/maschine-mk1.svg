  <text x="1110" y="380" fill="#ffffff" font-family="IBM Plex Sans, Arial, sans-serif" font-size="72" font-weight="700">MASCHINE MK1</text>
  <text x="1110" y="448" fill="#c6c6c6" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30">pads, transport, and legacy workstation control</text>
