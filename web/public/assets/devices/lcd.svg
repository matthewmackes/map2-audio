<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MAP2 LCD Console hero artwork</title>
  <desc id="desc">Stylized dual 20×4 HD44780 character LCD pair representing the MAP2 on-site LCD console with a phosphor-green display motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1e14" />
      <stop offset="100%" stop-color="#07361f" />
    </linearGradient>
    <linearGradient id="bezel" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#0b0b0b" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2a1a" />
      <stop offset="100%" stop-color="#0d3d22" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />

  <!-- Panel rack frame -->
  <rect x="130" y="150" width="720" height="600" rx="28" fill="url(#bezel)" stroke="#8d8d8d" stroke-width="3" />

  <!-- LCD 1 (top) -->
  <g transform="translate(170 200)">
    <rect width="640" height="220" rx="14" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="2" />
    <rect x="18" y="18" width="604" height="184" rx="8" fill="url(#screen)" />
    <!-- phosphor text LCD 1 -->
    <g font-family="'Courier New', monospace" font-size="30" fill="#80ff80" filter="url(#glow)" letter-spacing="2">
      <text x="42" y="66">MAP2 AUDIO PLATFORM</text>
      <text x="42" y="108">[LOCAL] &#9679; Ready    </text>
      <text x="42" y="150">48000 Hz / 64 spls  </text>
      <text x="42" y="192">NODE-A      14:32:18</text>
    </g>
  </g>

  <!-- LCD 2 (bottom) -->
  <g transform="translate(170 470)">
    <rect width="640" height="220" rx="14" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="2" />
    <rect x="18" y="18" width="604" height="184" rx="8" fill="url(#screen)" />
    <g font-family="'Courier New', monospace" font-size="30" fill="#80ff80" filter="url(#glow)" letter-spacing="2">
      <text x="42" y="66">CHAIN: Lead Tone    </text>
      <text x="42" y="108">VU -6  ############-</text>
      <text x="42" y="150">XRUNs: 0   CPU:  28%</text>
      <text x="42" y="192">Morph: (0.60, 0.40) </text>
    </g>
  </g>

  <!-- status indicator strip -->
  <g transform="translate(160 710)">
    <circle cx="0" cy="10" r="10" fill="#24a148" />
    <text x="24" y="18" fill="#8df7c5" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18">LCD 0 connected · native I²C · 0x27</text>
    <circle cx="320" cy="10" r="10" fill="#24a148" />
    <text x="344" y="18" fill="#8df7c5" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18">LCD 1 connected · ft232h · 0x3F</text>
  </g>

  <!-- right-side label block -->
  <g transform="translate(900 180)">
    <text x="0" y="0" fill="#8df7c5" font-family="IBM Plex Sans, Arial, sans-serif" font-size="32" letter-spacing="5">MAP2 CONSOLE</text>
    <text x="0" y="78" fill="#ffffff" font-family="IBM Plex Sans, Arial, sans-serif" font-size="78" font-weight="700">LCD</text>
    <text x="0" y="130" fill="#ffffff" font-family="IBM Plex Sans, Arial, sans-serif" font-size="44" font-weight="500">cluster</text>
    <text x="0" y="200" fill="#bff0d4" font-family="IBM Plex Sans, Arial, sans-serif" font-size="26">dual 20×4 HD44780 · multi-adapter</text>
    <text x="0" y="240" fill="#bff0d4" font-family="IBM Plex Sans, Arial, sans-serif" font-size="26">platform-event driven · morph-aware</text>

    <!-- iconographic cluster dots -->
    <g transform="translate(0 320)">
      <circle cx="20" cy="20" r="14" fill="#24a148" />
      <circle cx="70" cy="20" r="14" fill="#24a148" />
      <circle cx="120" cy="20" r="14" fill="#ff8c00" />
      <circle cx="170" cy="20" r="14" fill="#8d8d8d" />
      <text x="210" y="28" fill="#8df7c5" font-family="IBM Plex Sans, Arial, sans-serif" font-size="20">cluster · 4 peers</text>
    </g>

    <!-- surface pill -->
    <g transform="translate(0 400)">
      <rect width="380" height="50" rx="10" fill="#133d28" stroke="#24a148" stroke-width="2" />
      <text x="20" y="34" fill="#8df7c5" font-family="'IBM Plex Mono', monospace" font-size="20">/devices/lcd/displays</text>
    </g>
  </g>
</svg>
