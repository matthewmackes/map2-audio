  <title id="title">Tesira AVB hero artwork</title>
  <desc id="desc">Stylized product hero artwork for the Biamp Tesira AVB rack unit.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#22010e" />
      <stop offset="100%" stop-color="#520408" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect x="150" y="220" width="980" height="440" rx="26" fill="#131517" stroke="#8d8d8d" stroke-width="4" />
  <g transform="translate(230 292)">
