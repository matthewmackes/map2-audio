  <title id="title">Edirol UA-1000 hero artwork</title>
  <desc id="desc">Stylized product hero artwork for the Edirol UA-1000 audio interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#06203a" />
      <stop offset="100%" stop-color="#0353e9" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect x="140" y="220" width="1040" height="460" rx="26" fill="#0f1214" stroke="#8d8d8d" stroke-width="4" />
