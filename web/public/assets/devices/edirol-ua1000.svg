  <text x="1220" y="410" fill="#ffffff" font-family="IBM Plex Sans, Arial, sans-serif" font-size="72" font-weight="700">EDIROL UA-1000</text>
  <text x="1220" y="474" fill="#edf5ff" font-family="IBM Plex Sans, Arial, sans-serif" font-size="30">USB interface monitoring and front-of-rig audio control</text>
