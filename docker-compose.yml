# ⚠️ DEPRECATED: Docker Compose Support Removed
# 
# This file is deprecated and no longer maintained. MAP2 Audio now uses native systemd deployment.
# 
# See: NATIVE_DEPLOYMENT_GUIDE.md for current deployment instructions.
# 
# For historical reference only - do not use.
# ---

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: map2-backend
    ports:
      - "8080:8080"
    volumes:
      - map2-data:/data
      - /usr/lib/lv2:/usr/lib/lv2:ro  # Mount LV2 plugins (if available)
    environment:
      - MAP2_DB_URL=sqlite+aiosqlite:////data/map2.db
      - MAP2_LOG_LEVEL=INFO
      - MAP2_CORS_ORIGINS=http://localhost
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: map2-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: map2-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  map2-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: map2-network
