# MAP2 analog low-latency tuning for EDIROL UA-1000
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.usb-EDIROL_UA-1000_ZS22041-02.pro-input-0"
      }
      {
        node.name = "alsa_output.usb-EDIROL_UA-1000_ZS22041-02.pro-output-0"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 64
        api.alsa.period-num = 2
        api.alsa.headroom = 0
        api.alsa.disable-tsched = true
      }
    }
  }
]
