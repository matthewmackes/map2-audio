# T2529-A5 — MAP2 Audio Platform PipeWire low-latency configuration.
#
# Install path: /etc/pipewire/pipewire.conf.d/99-map2-audio.conf
# Activation:   systemctl restart pipewire-system   (system-wide instance)
# Verify:       pw-metadata 0 | grep -E '(rate|quantum)'
#
# Per the T2529 Q2 lock (2026-05-15), MAP2 connects to the SYSTEM-WIDE
# PipeWire instance (`pipewire-system.service`) at the canonical socket
# /run/pipewire-system/pipewire-0, NOT a per-user session bus. This
# fragment goes into /etc/pipewire/pipewire.conf.d/ so it's picked up by
# both the per-user (`pipewire.service` under the operator UID) AND the
# system-wide (`pipewire-system.service`) instance — PipeWire loads
# /etc/pipewire/pipewire.conf.d/ for both.
#
# Drift note: the original 99-map2-audio-latency.conf lived at
# ~/.config/pipewire/pipewire.conf.d/ under the operator's home. That
# location is the per-user instance ONLY and broke fresh installs on
# non-1000-UID operators. This file is the FHS-clean replacement.
#
# Targeting: <4 ms RTL on Edirol UA-1000 (USB HS, UAC1) at 48 kHz.
# Theoretical floor: ~2 ms USB framing + 1.33 ms ALSA period + scheduling.
#
# NOTE: clock.force-quantum is NOT set here. force-* values in .conf files
# are locked at PipeWire load time and cannot be overridden by pw-metadata.
# The force-quantum=64 is applied at service start via the map2-backend
# ExecStartPre.

context.properties = {
    # ── Sample rate ────────────────────────────────────────────────────────
    # Single allowed rate eliminates on-the-fly resampling entirely.
    # Resampling adds variable latency and CPU load; all hardware on this
    # system natively supports 48 kHz.
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]

    # ── Quantum / buffer size ───────────────────────────────────────────────
    # min-quantum=32: Enables 32-sample (0.67 ms) operation once the system
    # proves stable. Hard floor for UAC1 is ~48 samples (1 USB frame); test
    # before reducing force-quantum below 64.
    # max-quantum=256: Prevents JACK clients from dragging the graph to a
    # high-latency quantum. 256 @ 48 kHz = 5.33 ms — the hard ceiling.
    default.clock.min-quantum   = 32
    default.clock.quantum       = 64
    default.clock.max-quantum   = 256

    # ── ALSA period buffering ───────────────────────────────────────────────
    # period-num=2: 2 ALSA periods instead of default 3. Each period = one
    # quantum (64 samples = 1.33 ms). Saves one period of ALSA buffering = 1.33 ms RTL.
    # headroom=0: No extra sample padding at the ALSA layer.
    api.alsa.period-num         = 2
    api.alsa.headroom           = 0

    # ── Memory locking ──────────────────────────────────────────────────────
    # Prevents PipeWire graph memory from being paged to swap.
    # Requires memlock=unlimited in /etc/security/limits.d/99-map2-audio.conf
    # (which the RPM ships).
    mem.allow-mlock             = true
    mem.mlock-all               = true
}
