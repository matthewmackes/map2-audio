# T2529-A5 — drop-in for pipewire-system.service.
#
# Install path: /usr/lib/systemd/system/pipewire-system.service.d/10-map2-audio.conf
# Activation:   systemctl daemon-reload && systemctl restart pipewire-system
#
# Per the T2529 Q2 lock (2026-05-15), MAP2 uses the SYSTEM-WIDE PipeWire
# instance (`pipewire-system.service`) as the canonical audio substrate
# for the `map2` service user. The system-wide instance differs from the
# per-user one in two important ways:
#
#   1. Socket lives at /run/pipewire-system/pipewire-0 (not /run/user/<UID>/)
#   2. It runs as the `pipewire` system user with `pipewire-system` group
#
# This drop-in pins the system-wide instance off the isolated audio cores
# (CPUs 4,5 — those belong to the JUCE audio callback thread) and grants
# it the RT priority + memlock limits MAP2 needs to hit <4 ms RTL.

[Service]
# Stay off the isolated audio cores (4,5). The audio callback thread on
# CPU 4 + the dedicated USB IRQ on CPU 5 should not compete with the
# PipeWire daemon for cache or scheduler time.
CPUAffinity=0 1 2 3

# Modest RT priority. PipeWire's data-loop self-elevates to SCHED_FIFO/55
# when given LimitRTPRIO; the base unit doesn't grant it. Audio callback
# is at 80, libremidi at 70 → PipeWire at 55 stays below both.
LimitRTPRIO=55
LimitMEMLOCK=infinity
LimitNICE=10
