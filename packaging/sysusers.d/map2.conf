# T2529-A1 — declarative system-user creation for the MAP2 Audio Platform.
#
# Install path: /usr/lib/sysusers.d/map2.conf
# Activation:   systemd-sysusers --replace=/usr/lib/sysusers.d/map2.conf -
# Verify:       getent passwd map2; getent group map2
# Remove:       userdel map2 && groupdel map2  (operator-driven; package uninstall
#               deliberately preserves the user so /var/lib/map2 data isn't orphaned —
#               see Fedora Packaging Guidelines + Debian Policy Manual §10.7)
#
# Per the T2529 Q1 lock (2026-05-15), the `map2` user is a Linux system service
# user honoring /etc/login.defs UID_MIN. We rely on systemd-sysusers' default
# behavior, which:
#
#   1. Scans /etc/passwd for an unused UID in the system-UID range
#      (typically 100-999; honored from /etc/login.defs SYS_UID_MIN..SYS_UID_MAX).
#   2. Creates the account without a login shell or password.
#   3. Creates the home directory with the requested permissions if it doesn't
#      exist (we leave dir creation to systemd-tmpfiles, see ./tmpfiles.d/map2.conf,
#      so this directive uses an existing path that tmpfiles.d will provision).
#
# Group memberships (audio, pipewire, pipewire-system, video, input, plugdev) are
# applied by the RPM %post scriptlet via `usermod -aG`; they cannot be declared
# inside sysusers.d because not every host has all of those groups pre-existing.
# The %post step is idempotent and tolerates missing groups (best-effort via
# `getent group ... && usermod -aG`).
#
# Type meaning (from `man 5 sysusers.d`):
#
#   u  Create a user. UID auto-assigned ("-" placeholder) within the system range.
#      Home dir + shell honored verbatim.
#   g  Create a group with the given GID.
#   m  Add user to a group (we do NOT use this here — see comment above).

#Type Name  ID  GECOS                          Home directory  Shell
u     map2  -   "MAP2 Audio Platform service"  /var/lib/map2   /sbin/nologin

# A primary group named after the user is auto-created by systemd-sysusers
# (see man 5 sysusers.d, "u" type). No separate `g map2` line is needed.
