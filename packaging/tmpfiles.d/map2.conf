# T2529-A1 — declarative directory provisioning for the MAP2 Audio Platform.
#
# Install path: /usr/lib/tmpfiles.d/map2.conf
# Activation:   systemd-tmpfiles --create map2.conf
# Verify:       stat /var/lib/map2 /var/cache/map2 /var/log/map2 /run/map2
# Remove:       systemd-tmpfiles --remove map2.conf (best-effort; runtime dir
#               is auto-recreated on next boot)
#
# Per the T2529 Q3 lock (2026-05-15), the MAP2 install layout follows the
# strict FHS §3 split:
#
#   /opt/map2-audio/       — immutable application tree (root:root, packaged by RPM)
#   /etc/map2/             — system config (root:root, packaged by RPM)
#   /var/lib/map2/         — persistent service state (map2:map2)        ← tmpfiles
#   /var/cache/map2/       — caches (map2:map2)                          ← tmpfiles
#   /var/log/map2/         — logs (map2:map2)                            ← tmpfiles
#   /run/map2/             — runtime sockets + PID files (map2:map2)     ← tmpfiles
#
# The four `map2:map2` directories are provisioned here so they always exist
# with the correct ownership/perms regardless of whether the package is freshly
# installed or upgraded. systemd-tmpfiles runs at boot (`systemd-tmpfiles.service`)
# and re-creates /run/map2 after every reboot since /run is tmpfs.
#
# Type meaning (from `man 5 tmpfiles.d`):
#
#   d  Create a directory if it doesn't exist. If it exists, ownership + perms
#      are adjusted to match. Operator-modified files inside are NOT touched.
#   z  Adjust ownership/perms of an existing path WITHOUT creating (used for
#      paths the package installer already creates).
#   a  Apply an ACL.
#
# The mode 0750 on /var/log/map2 prevents non-map2 / non-root users from reading
# log files — operator joins `map2` group only if they need log access, which
# avoids leaking process state through journald-via-syslog mirrors.

#Type Path             Mode UID   GID   Age Argument
d     /var/lib/map2    0755 map2  map2  -   -
d     /var/cache/map2  0755 map2  map2  -   -
d     /var/log/map2    0750 map2  map2  -   -
d     /run/map2        0755 map2  map2  -   -

# Subdirectories under /var/lib/map2 that the service expects to exist at startup
# (created here rather than at first-write so a fresh install + immediate engine
# launch doesn't race against directory creation).

d     /var/lib/map2/snapshots    0755 map2  map2  -  -
d     /var/lib/map2/devices      0755 map2  map2  -  -
d     /var/lib/map2/sessions     0755 map2  map2  -  -
d     /var/lib/map2/recordings   0755 map2  map2  -  -

# Operator-overridable env file is packaged by RPM at /etc/map2/environment with
# root:root ownership, but the *.env.d/ drop-in dir is operator-writable through
# the map2 group so an operator with sudo can edit drop-ins without becoming root
# on the entire /etc/map2 tree.

d     /etc/map2/environment.d    0775 root  map2  -  -
