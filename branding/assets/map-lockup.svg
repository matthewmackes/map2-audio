<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1139 958" role="img" aria-label="Mackes Audio Platform">
  <title>Mackes Audio Platform</title>
  <rect x="0" y="0" width="1139" height="958" fill="var(--map-brand-background, #000000)"/>

  <!-- Icon: 2x2 blue grid, centered horizontally -->
  <g transform="translate(421 94)">
    <rect x="0" y="0" width="297" height="297" rx="66" ry="66" fill="var(--map-brand-primary, #4DA6FF)"/>
    <rect x="26" y="26" width="110" height="110" rx="16" ry="16" fill="var(--map-brand-background, #000000)"/>
    <rect x="161" y="26" width="110" height="110" rx="16" ry="16" fill="var(--map-brand-background, #000000)"/>
    <rect x="26" y="161" width="110" height="110" rx="16" ry="16" fill="var(--map-brand-background, #000000)"/>
    <rect x="161" y="161" width="110" height="110" rx="16" ry="16" fill="var(--map-brand-background, #000000)"/>
  </g>

  <!-- Wordmark: striped "MAP" -->
  <defs>
    <mask id="lockup-stripes" maskUnits="userSpaceOnUse" x="0" y="440" width="1139" height="340">
      <rect x="0" y="440" width="1139" height="340" fill="#000"/>
      <g fill="#fff">
        <rect x="0" y="440" width="1139" height="18"/>
        <rect x="0" y="472" width="1139" height="18"/>
        <rect x="0" y="504" width="1139" height="18"/>
        <rect x="0" y="536" width="1139" height="18"/>
        <rect x="0" y="568" width="1139" height="18"/>
        <rect x="0" y="600" width="1139" height="18"/>
        <rect x="0" y="632" width="1139" height="18"/>
        <rect x="0" y="664" width="1139" height="18"/>
        <rect x="0" y="696" width="1139" height="18"/>
        <rect x="0" y="728" width="1139" height="18"/>
        <rect x="0" y="760" width="1139" height="18"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#lockup-stripes)">
    <text x="569" y="752"
          text-anchor="middle"
          font-family="'Impact', 'Haettenschweiler', 'Arial Black', 'Helvetica Neue', sans-serif"
          font-weight="900"
          font-stretch="condensed"
          font-size="400"
          letter-spacing="-6"
          fill="var(--map-brand-primary, #4DA6FF)">MAP</text>
  </g>

  <!-- Tagline -->
  <text x="569" y="868"
        text-anchor="middle"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="56"
        letter-spacing="12"
        fill="var(--map-brand-primary, #4DA6FF)">MACKES AUDIO PLATFORM</text>
</svg>
