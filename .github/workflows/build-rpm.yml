name: Build & Publish RPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
      release_number:
        description: 'Release number (e.g., 1)'
        required: false
        default: '1'

jobs:
  build:
    name: Build RPM Package
    runs-on: ubuntu-latest
    container:
      image: fedora:40
    
    outputs:
      rpm-filename: ${{ steps.build.outputs.rpm-filename }}
      rpm-path: ${{ steps.build.outputs.rpm-path }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            rpmlint \
            git \
            python3-devel \
            python3-setuptools \
            cmake \
            gcc-c++ \
            make \
            pkgconf-pkg-config \
            alsa-lib-devel \
            systemd-rpm-macros \
            pipewire-jack-audio-connection-kit-devel \
            freetype-devel \
            fontconfig-devel \
            libX11-devel \
            libXext-devel \
            libXinerama-devel \
            libXrandr-devel \
            libXcursor-devel \
            mesa-libGL-devel \
            libcurl-devel \
            nodejs \
            npm \
            tar \
            gzip

      - name: Build canonical RPM
        id: build
        run: |
          VERSION=${{ github.event.release.tag_name || github.event.inputs.version }}
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          RELEASE=${{ github.event.inputs.release_number || '1' }}
          ARCH="x86_64"

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Single canonical build path — builds packaging/rpm/map2.spec (FHS,
          # service-user, sandboxed) into ./dist. build-rpm.sh exports QA_RPATHS
          # to accept the legitimate PipeWire-JACK RUNPATH on the engine .so.
          ./packaging/build-rpm.sh "$VERSION" "$RELEASE"

          RPM_FILE=$(find ./dist -name "map2-${VERSION}-*.${ARCH}.rpm" | head -1)
          echo "rpm-filename=$(basename "$RPM_FILE")" >> $GITHUB_OUTPUT
          echo "rpm-path=${RPM_FILE}" >> $GITHUB_OUTPUT
          echo "Build complete:"; ls -lh ./dist/

      - name: Lint RPM
        continue-on-error: true
        run: rpmlint ./dist/*.rpm || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-artifacts
          path: |
            dist/*.rpm
            dist/*.sha256
          retention-days: 30

  test:
    name: Test RPM Installation
    needs: build
    runs-on: ubuntu-latest
    container:
      image: fedora:41

    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: rpm-artifacts
          path: ./artifacts

      - name: Install MAP2 RPM (resolves Requires via dnf)
        run: |
          RPM=$(find ./artifacts -name "map2-*.x86_64.rpm" ! -name "*.src.rpm" | head -1)
          echo "Installing: $RPM"
          dnf install -y "$RPM"

      - name: Verify installation
        run: |
          rpm -qi map2
          echo "---"
          rpm -ql map2 | head -30
          echo "---"
          test -d /opt/map2-audio/web/dist && echo "frontend present"
          getent passwd map2 && echo "service user present"
          systemctl status map2-backend --no-pager || true

      - name: Check package contents
        run: |
          rpm -ql map2 | grep -E '(opt/map2-audio|systemd/system/map2|sysusers.d|tmpfiles.d)' || true

  publish:
    name: Publish RPM Release
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpm-artifacts
          path: ./artifacts
          
      - name: Create release notes
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v}
          
          cat > release-notes.md << EOF
          # MAP2 Audio Platform v${VERSION}
          
          ## Contents
          - Backend API service
          - Web interface
          - TUI management tools
          - Cluster orchestration
          - Update management system
          
          ## Installation
          \`\`\`bash
          sudo dnf install map2-${VERSION}*.rpm
          \`\`\`
          
          ## Quick Start
          \`\`\`bash
          sudo systemctl enable --now map2-backend
          sudo systemctl enable --now map2-frontend
          \`\`\`
          
          ## Release Notes
          ${{ github.event.release.body }}
          EOF
          
          cat release-notes.md
          
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.rpm
            artifacts/*.sha256
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-repo:
    name: Update RPM Repository
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: rpm-repo
          
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpm-artifacts
          path: ./rpms
          
      - name: Update repository
        run: |
          # Create repo structure
          mkdir -p fedora/41/x86_64

          # Copy new RPMs
          cp rpms/map2-*.x86_64.rpm fedora/41/x86_64/ || true

          # Update metadata
          dnf install -y createrepo_c
          createrepo_c fedora/41/x86_64/

          # Copy checksums
          cp rpms/*.sha256 fedora/41/x86_64/ || true
          
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add .
          git commit -m "Update RPM repository: ${{ github.event.release.tag_name }}" || true
          git push
