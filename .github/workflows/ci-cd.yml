name: MAP2 Audio Platform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev libasound2-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run self-tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: python -m scripts.self_test
    
    - name: Run pytest
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: pytest tests/ -v --cov=app --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend

  test-tui-smoke:
    name: Test TUI Smoke
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Minimal dependency set for compose-level TUI smoke coverage.
        pip install pytest textual httpx

    - name: Run TUI widget export smoke tests
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: |
        START_TS=$(date +%s)
        pytest -q tui/tests/test_widget_export_smoke.py
        END_TS=$(date +%s)
        DURATION=$((END_TS - START_TS))
        echo "TUI smoke duration: ${DURATION}s"
        {
          echo "## TUI Smoke Timing"
          echo ""
          echo "- Duration: ${DURATION}s"
        } >> "$GITHUB_STEP_SUMMARY"

  test-web:
    name: Test Web UI
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          web/package-lock.json

    - name: Install root test dependencies
      run: npm ci

    - name: Install web dependencies
      working-directory: ./web
      run: npm ci
    
    - name: Lint
      working-directory: ./web
      run: npm run lint || true

    - name: AVB routing frontend tests
      id: avb_tests
      run: |
        START_TS=$(date +%s)
        set +e
        npm run test:avb-routing
        TEST_EXIT=$?
        END_TS=$(date +%s)
        DURATION=$((END_TS - START_TS))

        echo "duration=${DURATION}" >> "$GITHUB_OUTPUT"
        echo "exit_code=${TEST_EXIT}" >> "$GITHUB_OUTPUT"

        if [ $TEST_EXIT -ne 0 ]; then
          exit $TEST_EXIT
        fi

    - name: AVB routing test summary
      if: always()
      run: |
        {
          echo "## AVB Routing Frontend Tests"
          echo ""
          echo "- Result: ${{ steps.avb_tests.outcome }}"
          echo "- Exit code: ${{ steps.avb_tests.outputs.exit_code }}"
          echo "- Duration: ${{ steps.avb_tests.outputs.duration }}s"
        } >> "$GITHUB_STEP_SUMMARY"
    
    - name: Build
      working-directory: ./web
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: web-build
        path: web/dist/

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install linting tools
      run: |
        pip install black flake8 pylint mypy
    
    - name: Run black
      run: black --check app/ tests/ scripts/ tui/ lcd/
      continue-on-error: true
    
    - name: Run flake8
      run: flake8 app/ tests/ scripts/ --max-line-length=120
      continue-on-error: true

    - name: Gate unused imports in TUI widget/screen paths
      run: flake8 tui/widgets/__init__.py tui/screens/ --select=F401 --statistics

    - name: Gate unused imports in staged backend routes
      run: flake8 app/routes/config_api.py app/routes/base.py app/routes/deployment.py app/routes/cluster_admin.py app/routes/audio_diagnostics.py app/routes/system.py --select=F401 --statistics

    - name: Run pylint
      run: pylint app/ --disable=all --enable=E,F
      continue-on-error: true

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-tui-smoke, test-web]
    if: github.event_name == 'push' || github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      if: github.event_name == 'release'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          map2/backend
          map2/web
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    
    - name: Build backend image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name == 'release' }}
        tags: map2/backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build web image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.web
        push: ${{ github.event_name == 'release' }}
        tags: map2/web:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        # e.g., kubectl apply, docker-compose, etc.

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.event_name == 'release'
    environment: production
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
