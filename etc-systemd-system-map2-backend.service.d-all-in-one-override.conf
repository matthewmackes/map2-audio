[Unit]
# All-in-one mode systemd drop-in
# Location: /etc/systemd/system/map2-backend.service.d/all-in-one-override.conf
#
# Description:
#   Compromise tuning for ALL-IN-ONE mode.
#   Python FastAPI on housekeeping cores; C++ engine gets isolated cores.
#   Target latency: 4-5ms (acceptable compromise)

# Note: Do NOT add After=multi-user.target - it creates an ordering cycle
# with WantedBy=multi-user.target in the base unit

[Service]
# CPU Affinity: Allow both housekeeping and isolated cores
# Scheduler prefers housekeeping (0-3) for Python, isolated (4-5) available
CPUAffinity=0-3 4-5
CPUQuota=50%

# Nice priority (high but below audio mode)
Nice=-10

# Realtime priorities (conservative for all-in-one)
LimitRTPRIO=50
LimitMEMLOCK=512M

# I/O priority (balanced)
IOSchedulingClass=realtime
IOSchedulingPriority=3

# Timeouts
TimeoutStartSec=120
TimeoutStopSec=30

# Logging
StandardOutput=journal
StandardError=journal
