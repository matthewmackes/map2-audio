# MAP2 Audio Platform - GRUB Kernel Parameters
# File: /etc/default/grub.d/20-map2-audio-latency.cfg
#
# Description:
#   Low-latency audio kernel parameters for AUDIO mode.
#   Applied via systemd service at boot; requires GRUB config regeneration.
#
# Critical parameters:
#   - isolcpus=4,5: Isolate cores 4,5 for audio (no kernel work)
#   - nohz_full=4,5: Disable timer interrupts on isolated cores
#   - rcu_nocbs=4,5: No RCU callback work on isolated cores
#   - threadirqs: Convert hardirqs to softirq threads (more predictable)
#   - skew_tick=1: Reduce timer wheel jitter
#   - nmi_watchdog=0: Disable NMI watchdog (costs ~1% CPU)
#   - audit=0: Disable audit subsystem (saves ~0.5% CPU, 0.1ms jitter)
#   - idle=nomwait: Reduce C-state entry latency
#   - pci=nomsi: Disable MSI interrupts (if unstable with audio interface)

# For AUDIO mode (aggressive tuning)
GRUB_CMDLINE_LINUX_DEFAULT="isolcpus=4,5 nohz_full=4,5 rcu_nocbs=4,5 threadirqs skew_tick=1 nmi_watchdog=0 audit=0 idle=nomwait pci=nomsi"
