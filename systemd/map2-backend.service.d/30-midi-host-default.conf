# T2482-P1.1 Gap E phase 2 (iter 52) — pin MAP2_USE_MIDI_HOST=1 in
# the production unit so the controller-host routing default is
# explicit + auditable in the unit listing rather than only in
# Python code.
#
# This drop-in is purely belt-and-braces — the Python code defaults
# to ON as of iter 51, so even without this drop-in the host path
# runs. Pinning it here guarantees the value shows up in
# `systemctl show map2-backend.service -p Environment` for operators
# diagnosing routing issues.
#
# To force the rtmidi fallback for a single boot:
#   sudo systemctl edit --runtime map2-backend.service
#   [Service]
#   Environment="MAP2_USE_MIDI_HOST=0"
# Then `systemctl restart map2-backend.service`.
#
# After iters 54-58 strip the rtmidi fallback paths, this drop-in
# (and the env var itself) becomes redundant — iter 59 cleans up.

[Service]
Environment="MAP2_USE_MIDI_HOST=1"
