# systemd-tmpfiles fragment for map2-controller-host.service
#
# Creates /run/map2 owned by root:root with 0755 perms on every boot
# so the daemon's ReadWritePaths=/run/map2 directive can succeed
# during PrivateTmp/namespace setup. Without this fragment the service
# fails at namespace setup with status=226/NAMESPACE because systemd
# applies ReadWritePaths= BEFORE running ExecStartPre=mkdir.
#
# Type d = create directory if missing.
# Path  = /run/map2
# Mode  = 0755
# User  = mm    (the daemon runs as 'mm' and its ExecStartPre=chmod
#                also runs as 'mm'; root ownership broke that step
#                with EPERM. Matches the sibling /run/map2-audio
#                tmpfiles fragment that has worked for months.)
# Group = mm
# Age   = -     (never auto-clean; lifecycle is per-boot via /run)
d /run/map2 0755 mm mm -
