# MAP2_MODE=management
# ──────────────────────────────────────────────────────────────────────
# MANAGEMENT mode systemd drop-in for map2-backend.service
# Installed by: map2-mode.sh → /etc/systemd/system/map2-backend.service.d/10-mode.conf
#
# Web UI and cluster management only — no audio processing.
# Standard scheduling, no realtime requirements.
# ──────────────────────────────────────────────────────────────────────

[Service]
# CPU Affinity — unrestricted, use whatever the scheduler assigns
CPUAffinity=

# No realtime priorities needed
LimitRTPRIO=0
LimitMEMLOCK=64M

# Nice priority — normal
Nice=0

# I/O scheduling — best-effort (default)
IOSchedulingClass=best-effort
IOSchedulingPriority=4

# Timeouts
TimeoutStartSec=60
TimeoutStopSec=15

# Logging — journal
StandardOutput=journal
StandardError=journal
