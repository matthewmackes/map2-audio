# MAP2_MODE=audio
# ──────────────────────────────────────────────────────────────────────
# AUDIO mode systemd drop-in for map2-backend.service
# Installed by: map2-mode.sh → /etc/systemd/system/map2-backend.service.d/10-mode.conf
#
# Strict realtime tuning for dedicated audio processing.
# Target latency: <3 ms round-trip.
# ──────────────────────────────────────────────────────────────────────

[Service]
# CPU Isolation — pin to isolated cores ONLY
CPUAffinity=4 5

# Realtime priorities — maximum
LimitRTPRIO=95
LimitMEMLOCK=infinity

# Nice priority — highest non-RT
Nice=-20

# I/O scheduling — realtime, highest priority
IOSchedulingClass=realtime
IOSchedulingPriority=1

# Timeouts
TimeoutStartSec=120
TimeoutStopSec=30

# Logging — file output (journal overhead too high for RT)
StandardOutput=file:/run/map2-audio-backend.log
StandardError=file:/run/map2-audio-backend.log
