[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mackes-audio-platform-2"
version = "2.0.0-FEB2025"
description = "Mackes Audio Platform 2 FEB2025 - Professional real-time audio processing with LV2 plugins, MIDI routing, and dual LCD monitoring"
authors = [{name = "Matthew Mackes", email = "audio@mackesaudio.com"}]
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.8",
    "pylilv>=0.24.0",
    "textual>=0.46.0",
    "zeroconf>=0.148.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.3",
    "prometheus-client>=0.19.0",
    "aiofiles>=23.2.0",
    "py7zr>=0.20.0",
    "jsonschema>=4.17.0",
    "psutil>=5.9.0",
    "aiohttp>=3.9.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
lcd = [
    "pyftdi>=0.55.0",
    "RPLCD>=1.3.0",
    "smbus2>=0.4.0",
]

[project.scripts]
map2-backend = "app.main:main"
map2-tui = "tui.app:main"
map2-cli = "scripts.cli:main"
map2-self-test = "scripts.self_test:main"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
