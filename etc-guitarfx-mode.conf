#!/bin/bash
# MAP2 Audio Platform - Mode Configuration
# Location: /etc/guitarfx-mode.conf
#
# This file controls the system tuning mode for the MAP2 audio platform.
# Supported modes:
#   - audio: Dedicated low-latency audio processor (target <3ms)
#   - all-in-one: Audio + web UI on same machine (target 4-5ms)
#   - management: Web UI & management only (no audio processing)
#
# Change MODE value and run:
#   curl -X POST http://localhost:8080/api/system/cpu-isolation/reset-to-mode
# OR manually:
#   systemctl daemon-reload && systemctl restart map2-backend

MODE=audio
