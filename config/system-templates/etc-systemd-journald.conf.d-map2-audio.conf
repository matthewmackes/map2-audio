[Journal]
# MAP2 Audio Platform - Journald Configuration (Audio Mode)
# Location: /etc/systemd/journald.conf.d/map2-audio.conf
#
# Description:
#   Minimize journald overhead for audio processing.
#   Logging to disk can cause 5-20ms latency spikes; use volatile (memory) only.
#
# Applies to: AUDIO mode, ALL-IN-ONE mode
# Impact: Eliminates disk I/O jitter from logging

# Store journal in memory only (volatile), not on disk
Storage=volatile

# Limit memory usage for journal
RuntimeMaxUse=256M
RuntimeMaxFileSize=32M

# Never sync to disk (already volatile, but be explicit)
SyncIntervalSec=0

# No compression (saves CPU)
Compress=no

# Don't forward to console (saves I/O)
ForwardToConsole=no
ForwardToSyslog=no

# Minimal buffering
RateLimitInterval=1s
RateLimitBurst=1000
