[Unit]
# PipeWire/WireRouter CPU affinity drop-in
# Location: /etc/systemd/user@.service.d/pipewire-affinity.conf
#
# Description:
#   Pin PipeWire session manager to housekeeping cores (0-3).
#   Prevents WireRouter from running on isolated cores (4-5).
#   Eliminates 1-2ms glitches from device hot-plug or graph rebalancing.
#
# Applies to: AUDIO mode, ALL-IN-ONE mode
# Impact: Smooth device hot-plug, no graph rebalancing latency spikes

After=user@.service

[Service]
# PipeWire on housekeeping cores only
CPUAffinity=0-3

# High but non-realtime priority
Nice=-5

# No RT scheduling (PipeWire doesn't need it; we want it low-priority)
LimitRTPRIO=0
