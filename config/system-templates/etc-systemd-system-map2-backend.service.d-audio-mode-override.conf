[Unit]
# Audio mode systemd drop-in for map2-backend service
# Location: /etc/systemd/system/map2-backend.service.d/audio-mode-override.conf
#
# Description:
#   Strict realtime tuning for AUDIO mode.
#   Applied only when MODE=audio in /etc/guitarfx-mode.conf
#
# Key settings:
#   - CPUAffinity=4 5: Strictly pin to isolated cores only
#   - LimitRTPRIO=95: Allow high RT priorities
#   - Nice=-20: Highest non-RT priority
#   - IOSchedulingClass=realtime: RT I/O priority
#   - LimitMEMLOCK=infinity: Allow mlock() for buffer

# Note: Do NOT add After=multi-user.target - it creates an ordering cycle
# with WantedBy=multi-user.target in the base unit

[Service]
# CPU Isolation (CRITICAL for <3ms latency)
CPUAffinity=4 5

# Realtime Priorities
LimitRTPRIO=95
LimitMEMLOCK=infinity

# Nice priority (highest non-realtime)
Nice=-20

# I/O Scheduling
IOSchedulingClass=realtime
IOSchedulingPriority=1

# Timeouts
TimeoutStartSec=120
TimeoutStopSec=30

# Logging
StandardOutput=file:/run/map2-audio-backend.log
StandardError=file:/run/map2-audio-backend.log
