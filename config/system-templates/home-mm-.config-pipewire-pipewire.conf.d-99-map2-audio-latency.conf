# MAP2 Audio Platform - PipeWire Low-Latency Configuration
# Location: ~/.config/pipewire/pipewire.conf.d/99-map2-audio-latency.conf
#
# Description:
#   Low-latency audio settings for PipeWire graph engine.
#   Disable resampling (forces 48kHz), optimize quantum settings.
#   REMARK: This template is a baseline. Profile-driven overrides are managed by:
#   scripts/apply_clock_sync_profile.py
#   and may rewrite this file with alternate allowed-rates mappings.
#
# Applied to: User session (mm user)

context.properties = {
    # Fixed 48kHz sample rate (no resampling)
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    
    # Minimum quantum (buffer size in samples)
    default.clock.min-quantum = 64
    
    # Prefer low latency mode
    default.clock.quantum = 64
    
    # ALSA period optimization: 2 periods instead of default 3
    # Saves one full period of buffering (~1.33ms at 64/48kHz)
    api.alsa.period-num = 2
    api.alsa.headroom = 0
    
    # Lock PipeWire memory to prevent page faults in audio path
    mem.allow-mlock = true
    mem.mlock-all = true
}
